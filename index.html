<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maudit mot dit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #e94560;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 1rem;
      color: #a8b2d8;
      margin-bottom: 3rem;
    }

    .words-grid {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .word-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2rem 3rem;
      min-width: 200px;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .word-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(233, 69, 96, 0.3);
    }

    .word {
      font-size: 2rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 1rem;
      text-transform: capitalize;
    }

    .number {
      font-size: 3.5rem;
      font-weight: 900;
      color: #e94560;
      line-height: 1;
    }

    .number-label {
      font-size: 0.75rem;
      color: #a8b2d8;
      margin-top: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .refresh-btn {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
    }

    .refresh-btn:hover {
      background: #c73652;
      box-shadow: 0 6px 28px rgba(233, 69, 96, 0.6);
    }

    .refresh-btn:active {
      transform: scale(0.97);
    }

    .refresh-btn .icon {
      display: inline-block;
      margin-right: 0.5rem;
      transition: transform 0.5s ease;
    }

    .refresh-btn.spinning .icon {
      animation: spin 0.5s linear;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Maudit mot dit</h1>
    <p class="subtitle">Deux mots français avec leurs chiffres</p>

    <div class="words-grid" id="wordsGrid">
      <!-- Cards generated by JS -->
    </div>

    <button class="refresh-btn" id="refreshBtn" onclick="drawNewWords()">
      <span class="icon">🔄</span> Nouveau tirage
    </button>
  </div>

  <script>
    const mots = [
      "chat", "chien", "maison", "arbre", "soleil", "lune", "étoile", "fleur",
      "forêt", "rivière", "montagne", "nuage", "pluie", "vent", "feu", "eau",
      "terre", "ciel", "mer", "île", "pont", "rue", "ville", "village",
      "jardin", "fenêtre", "porte", "table", "chaise", "livre", "stylo", "sac",
      "pain", "fromage", "vin", "café", "thé", "soupe", "gâteau", "pomme",
      "vélo", "voiture", "train", "bateau", "avion", "route", "plage", "lac",
      "école", "marché", "musique", "chanson", "danse", "peinture", "sculpture",
      "neige", "glace", "sable", "pierre", "bois", "métal", "verre", "tissu",
      "enfant", "famille", "ami", "voisin", "médecin", "artisan", "fermier",
      "matin", "soir", "nuit", "saison", "printemps", "été", "automne", "hiver",
      "lettre", "journal", "histoire", "chemin", "champ", "vallon", "colline"
    ];

    function pickTwo(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return [arr[0], arr[1]];
    }

    function randomNumber() {
      return Math.floor(Math.random() * 5) + 1;
    }

    function buildCards(words) {
      const grid = document.getElementById('wordsGrid');
      grid.innerHTML = '';
      words.forEach(({ mot, num }) => {
        const card = document.createElement('div');
        card.className = 'word-card';
        card.innerHTML = `
          <div class="word">${mot}</div>
          <div class="number">${num}</div>
          <div class="number-label">Chiffre</div>
        `;
        grid.appendChild(card);
      });
    }

    function drawNewWords() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      setTimeout(() => btn.classList.remove('spinning'), 500);

      const [m1, m2] = pickTwo(mots);
      buildCards([
        { mot: m1, num: randomNumber() },
        { mot: m2, num: randomNumber() }
      ]);
    }

    // Initial render
    drawNewWords();
  </script>
</body>
</html>
